name: Build Windows exe and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg (bundled into the exe)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-src
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Get-ChildItem ffmpeg-src -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination ffmpeg
          Get-ChildItem ffmpeg

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --console --name HLS-Downloader
          --add-data "templates;templates"
          --add-binary "ffmpeg/ffmpeg.exe;ffmpeg"
          --add-binary "ffmpeg/ffprobe.exe;ffmpeg"
          --collect-submodules yt_dlp
          app.py

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $p = Start-Process dist\HLS-Downloader.exe -ArgumentList "--no-browser","--port","8123" -PassThru
          Start-Sleep -Seconds 15
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8123/
          if ($r.Content -notmatch "<title>HLS Downloader</title>") { throw "UI did not load" }
          if ($r.Content -match "ffmpeg was not found") { throw "bundled ffmpeg not found" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: HLS-Downloader-windows
          path: dist/HLS-Downloader.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HLS-Downloader.exe
          generate_release_notes: true
          body: |
            ## HLS Downloader ${{ github.ref_name }}

            **Windows:** download `HLS-Downloader.exe` below and double-click it. A console window opens and your browser shows the app. Close the console window to quit. ffmpeg is built in, so there's nothing else to install.

            Downloads are saved to `Downloads\HLS Downloader` in your user folder.

            Windows SmartScreen may warn that the app is unrecognised because it isn't code-signed. Click **More info → Run anyway**.

            **Mac/Linux or command line:** see the README to run from source.
